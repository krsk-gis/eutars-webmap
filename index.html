<!DOCTYPE html>
<html>
<head>
    <title>A ZH után visszatérünk!</title>
    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; /* Egymás alá rakja az elemeket */

            align-items: center; 
            height: 100vh; 
            background-color: #000; 
            color: #fff; /* Fehér szövegszín */
            font-family: sans-serif; /* Tisztább betűtípus */

            max-width: 80%; /* Hogy ne töltse ki a teljes képernyőt */

        h1 {
            margin: 0;
            text-align: center;
        }

<body>
    <img src="nono.gif" alt="No no!">
